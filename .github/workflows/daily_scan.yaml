name: Daily Stock Analysis

on:
  schedule:
    # 星期一到五，UTC 時間 06:00 (台灣時間 14:00) 跑一次
    # Cron 格式: 分 時 日 月 週
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕執行測試

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        ref: main  # 指定從 main 抓取程式碼邏輯

    - name: Set up Python
      uses: actions/checkout@v3
      with:
        python-version: '3.11'

    - name: Install TA-Lib
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        cd ..

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analysis
      run: python main.py

    - name: Commit and Push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
          
        # 切換分支
        git checkout -b daily-results || git checkout daily-results
          
        # 使用 -f 強制加入被 .gitignore 忽略的資料夾
        git add -f data/reports/ data/plots/
          
        # 也可以順便把 logs 加進去（如果你想看雲端執行的日誌）
        git add -f logs/
          
        git commit -m "auto: daily stock analysis $(date +'%Y-%m-%d')" || echo "No changes"
        git push origin daily-results --force